<!DOCTYPE html>
<html>
<head>
    <title>Internship Application Form</title>
</head>
<body>
    <h2>Internship Application Form</h2>
    <form>
        
        <fieldset>
            <legend>Personal Details</legend>
            
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
            
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br><br>
            
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter a password" required><br><br>
            
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label><br><br>
        </fieldset>
        
    
        <fieldset>
            <legend>Educational Details</legend>
            
            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">--Select Course--</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="Mechanical">Mechanical</option>
            </select><br><br>
            
            <label>Skills:</label><br>
            <input type="checkbox" id="java" name="skills" value="Java">
            <label for="java">Java</label><br>
            
            <input type="checkbox" id="javascript" name="skills" value="JavaScript">
            <label for="javascript">JavaScript</label><br>
            
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label><br>
            
            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label><br>
            
            <input type="checkbox" id="react" name="skills" value="React">
            <label for="react">React</label><br><br>
        </fieldset>
        
        
        <fieldset>
            <legend>Internship Details</legend>
            
            <label>Internship Preference:</label>
            <input type="radio" id="onsite" name="preference" value="Onsite" required>
            <label for="onsite">Onsite</label>
            <input type="radio" id="remote" name="preference" value="Remote">
            <label for="remote">Remote</label><br><br>
            
            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" required><br><br>
            
            <label for="coverletter">Cover Letter:</label><br>
            <textarea id="coverletter" name="coverletter" rows="5" cols="40" placeholder="Write your cover letter here..." required></textarea><br><br>
        </fieldset>
        
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
