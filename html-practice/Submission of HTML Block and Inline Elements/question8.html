<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>

<body>

    <!-- School Name -->
    <h1>ABC Public School</h1>

    <h2>Student Report Card</h2>

    <table border="1">

        <!-- Table Heading -->
        <tr>
            <th rowspan="2" title="Student Information">
                Student Name
            </th>

            <th rowspan="2" title="Subject Name">
                Subject
            </th>

            <th colspan="2" title="Marks Information">
                Marks
            </th>
        </tr>

        <tr>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>

        <!-- Subject 1 -->
        <tr>
            <td rowspan="5">Anuj Chaudhary</td>
            <td>English</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <!-- Subject 2 -->
        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <!-- Subject 3 -->
        <tr>
            <td>Computer Science</td>
            <td>100</td>
            <td>91</td>
        </tr>

        <!-- Subject 4 -->
        <tr>
            <td>Physics</td>
            <td>100</td>
            <td>79</td>
        </tr>

        <!-- Subject 5 -->
        <tr>
            <td>Chemistry</td>
            <td>100</td>
            <td>84</td>
        </tr>

        <!-- Total and Percentage -->
        <tr>
            <th colspan="2">Total</th>
            <td>500</td>
            <td>424</td>
        </tr>

        <tr>
            <th colspan="3">Percentage</th>
            <td>84.8%</td>
        </tr>

    </table>

</body>

</html>
